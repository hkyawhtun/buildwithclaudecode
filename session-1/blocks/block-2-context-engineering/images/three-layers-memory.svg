<text x="960" y="910" text-anchor="middle" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="36" font-weight="700" fill="#374151">Context Window</text>
<text x="960" y="955" text-anchor="middle" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="24" fill="#6B7280">All three layers feed into Claude's finite working memory</text>

