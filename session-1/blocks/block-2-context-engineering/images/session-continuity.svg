<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1920 1080" fill="none">
<rect width="1920" height="1080" fill="#FFFFFF"/>

<!-- Title (amber) -->
<rect x="610" y="50" width="700" height="70" rx="12" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2"/>
<text x="960" y="95" text-anchor="middle" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="44" font-weight="800" fill="#374151" letter-spacing="-1">SESSION CONTINUITY</text>

<!-- Subtitle -->
<text x="960" y="160" text-anchor="middle" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="22" fill="#6B7280">Continue, resume, or fork sessions to preserve context across conversations</text>

<!-- === SECTION 1: Main session timeline (green) === -->
<text x="120" y="250" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="28" font-weight="700" fill="#374151">Session Timeline</text>

<!-- Timeline bar -->
<line x1="120" y1="320" x2="1200" y2="320" stroke="#00BD78" stroke-width="4"/>

<!-- Session dots -->
<circle cx="200" cy="320" r="16" fill="#D6F5E8" stroke="#00BD78" stroke-width="2"/>
<circle cx="400" cy="320" r="16" fill="#D6F5E8" stroke="#00BD78" stroke-width="2"/>
<circle cx="600" cy="320" r="16" fill="#D6F5E8" stroke="#00BD78" stroke-width="2"/>
<circle cx="800" cy="320" r="16" fill="#D6F5E8" stroke="#00BD78" stroke-width="2"/>
<circle cx="1000" cy="320" r="16" fill="#D6F5E8" stroke="#00BD78" stroke-width="2"/>
<circle cx="1200" cy="320" r="16" fill="#D6F5E8" stroke="#00BD78" stroke-width="2"/>

<!-- Session ID label -->
<text x="200" y="290" text-anchor="middle" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" fill="#00BD78">session-abc123</text>
<text x="200" y="370" text-anchor="middle" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="16" fill="#6B7280">Turn 1</text>
<text x="400" y="370" text-anchor="middle" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="16" fill="#6B7280">Turn 2</text>
<text x="600" y="370" text-anchor="middle" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="16" fill="#6B7280">Turn 3</text>
<text x="800" y="370" text-anchor="middle" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="16" fill="#6B7280">Turn 4</text>
<text x="1000" y="370" text-anchor="middle" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="16" fill="#6B7280">Turn 5</text>
<text x="1200" y="370" text-anchor="middle" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="16" fill="#6B7280">Turn 6</text>

<!-- === --continue command box (green) === -->
<rect x="1340" y="260" width="460" height="120" rx="12" fill="#D6F5E8" stroke="#00BD78" stroke-width="2"/>
<text x="1570" y="305" text-anchor="middle" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="24" font-weight="700" fill="#374151">--continue</text>
<text x="1570" y="340" text-anchor="middle" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="18" fill="#6B7280">Appends to the most recent</text>
<text x="1570" y="365" text-anchor="middle" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="18" fill="#6B7280">session automatically</text>

<!-- Arrow from --continue to timeline end -->
<line x1="1340" y1="320" x2="1220" y2="320" stroke="#9CA3AF" stroke-width="2"/>
<polygon points="1222,313 1208,320 1222,327" fill="#9CA3AF"/>

<!-- === --resume command box (green) === -->
<rect x="1340" y="430" width="460" height="120" rx="12" fill="#D6F5E8" stroke="#00BD78" stroke-width="2"/>
<text x="1570" y="475" text-anchor="middle" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="24" font-weight="700" fill="#374151">--resume</text>
<text x="1570" y="510" text-anchor="middle" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="18" fill="#6B7280">Pick a specific session</text>
<text x="1570" y="535" text-anchor="middle" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="18" fill="#6B7280">from the session list</text>

<!-- Arrow from --resume to a mid-point on timeline -->
<path d="M1340 490 L1100 490 L1100 340" fill="none" stroke="#9CA3AF" stroke-width="2"/>
<polygon points="1093,342 1100,328 1107,342" fill="#9CA3AF"/>

<!-- === SECTION 2: Fork (gray — the alternative path) === -->
<text x="120" y="660" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="28" font-weight="700" fill="#374151">Fork creates a new session from any point</text>

<!-- Original timeline (faded gray) -->
<line x1="120" y1="730" x2="800" y2="730" stroke="#D1D5DB" stroke-width="3"/>
<circle cx="200" cy="730" r="14" fill="#F3F4F6" stroke="#D1D5DB" stroke-width="2"/>
<circle cx="400" cy="730" r="14" fill="#F3F4F6" stroke="#D1D5DB" stroke-width="2"/>
<circle cx="600" cy="730" r="14" fill="#F3F4F6" stroke="#D1D5DB" stroke-width="2"/>
<circle cx="800" cy="730" r="14" fill="#F3F4F6" stroke="#D1D5DB" stroke-width="2"/>

<text x="200" y="700" text-anchor="middle" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="16" fill="#9CA3AF">session-abc123</text>

<!-- Fork point highlight -->
<circle cx="600" cy="730" r="22" fill="none" stroke="#D1D5DB" stroke-width="2.5"/>

<!-- Fork branch (gray) -->
<path d="M600 730 Q650 800 700 850" fill="none" stroke="#D1D5DB" stroke-width="3"/>
<line x1="700" y1="850" x2="1100" y2="850" stroke="#D1D5DB" stroke-width="3"/>
<circle cx="800" cy="850" r="14" fill="#F3F4F6" stroke="#D1D5DB" stroke-width="2"/>
<circle cx="1000" cy="850" r="14" fill="#F3F4F6" stroke="#D1D5DB" stroke-width="2"/>

<text x="800" y="820" text-anchor="middle" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="16" fill="#9CA3AF">session-xyz789 (new ID)</text>

<!-- --fork-session command box (gray) -->
<rect x="1340" y="790" width="460" height="120" rx="12" fill="#F3F4F6" stroke="#D1D5DB" stroke-width="2"/>
<text x="1570" y="835" text-anchor="middle" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="24" font-weight="700" fill="#374151">--fork-session</text>
<text x="1570" y="870" text-anchor="middle" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="18" fill="#6B7280">Branch from a point in history</text>
<text x="1570" y="895" text-anchor="middle" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="18" fill="#6B7280">with a new session ID</text>

<!-- Arrow from --fork-session to fork point -->
<path d="M1340 850 L1120 850" fill="none" stroke="#9CA3AF" stroke-width="2"/>
<polygon points="1122,843 1108,850 1122,857" fill="#9CA3AF"/>

<!-- Usage example -->
<text x="120" y="990" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="18" fill="#6B7280">Usage:</text>
<rect x="210" y="970" width="460" height="32" rx="8" fill="#DBEAFE" stroke="#3B82F6" stroke-width="1.5"/>
<text x="440" y="992" text-anchor="middle" font-family="ui-monospace, monospace" font-size="16" font-weight="600" fill="#374151">claude --resume abc123 --fork-session</text>

<!-- Legend -->
<rect x="1340" y="1020" width="16" height="16" rx="4" fill="#D6F5E8" stroke="#00BD78" stroke-width="1.5"/>
<text x="1364" y="1034" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="16" fill="#6B7280">Append to session</text>

<rect x="1540" y="1020" width="16" height="16" rx="4" fill="#F3F4F6" stroke="#D1D5DB" stroke-width="1.5"/>
<text x="1564" y="1034" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="16" fill="#6B7280">Fork (new session)</text>

</svg>