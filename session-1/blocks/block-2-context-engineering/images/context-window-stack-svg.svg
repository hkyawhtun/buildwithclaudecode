<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 30 1920 1020" fill="none">
<rect x="0" y="30" width="1920" height="1020" rx="12" fill="#FFFFFF"/>

<!-- Layer 5: Conversation (AMBER) -->
<rect x="260" y="60" width="1400" height="160" rx="12" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2"/>
<text x="320" y="130" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="36" font-weight="700" fill="#374151">Conversation</text>
<text x="320" y="175" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="24" fill="#6B7280">Your prompts + Claude's work -- grows over time</text>

<!-- Layer 4: Second Brain (GRAY, dashed) -->
<rect x="260" y="260" width="1400" height="160" rx="12" fill="#F3F4F6" stroke="#D1D5DB" stroke-width="2" stroke-dasharray="8 4"/>
<text x="320" y="330" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="36" font-weight="700" fill="#374151">Second Brain</text>
<text x="320" y="375" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="24" fill="#6B7280">On demand -- you choose what loads</text>
<rect x="1440" y="310" width="160" height="40" rx="8" fill="#F3F4F6" stroke="#D1D5DB" stroke-width="1.5"/>
<text x="1520" y="338" text-anchor="middle" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="20" font-weight="600" fill="#9CA3AF">OPTIONAL</text>

<!-- Layer 3: Auto Memory (GREEN) -->
<rect x="260" y="460" width="1400" height="160" rx="12" fill="#D6F5E8" stroke="#00BD78" stroke-width="2"/>
<text x="320" y="530" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="36" font-weight="700" fill="#374151">Auto Memory</text>
<text x="320" y="575" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="24" fill="#6B7280">First 200 lines, loaded automatically each session</text>
<rect x="1440" y="510" width="160" height="40" rx="8" fill="#D6F5E8" stroke="#00BD78" stroke-width="1.5"/>
<text x="1520" y="538" text-anchor="middle" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="20" font-weight="600" fill="#00BD78">AUTO</text>

<!-- Layer 2: .claude/rules/ (GREEN) -->
<rect x="260" y="660" width="1400" height="160" rx="12" fill="#D6F5E8" stroke="#00BD78" stroke-width="2"/>
<text x="320" y="730" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="36" font-weight="700" fill="#374151">.claude/rules/</text>
<text x="320" y="775" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="24" fill="#6B7280">Path-specific rules, loaded when matching files are read</text>
<rect x="1440" y="710" width="160" height="40" rx="8" fill="#D6F5E8" stroke="#00BD78" stroke-width="1.5"/>
<text x="1520" y="738" text-anchor="middle" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="20" font-weight="600" fill="#00BD78">AUTO</text>

<!-- Layer 1: CLAUDE.md (GREEN, thicker border) -->
<rect x="260" y="860" width="1400" height="160" rx="12" fill="#D6F5E8" stroke="#00BD78" stroke-width="2.5"/>
<text x="320" y="930" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="36" font-weight="700" fill="#374151">CLAUDE.md</text>
<text x="320" y="975" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="24" fill="#6B7280">Always loaded, every session -- your project's instruction manual</text>
<rect x="1440" y="910" width="160" height="40" rx="8" fill="#D6F5E8" stroke="#00BD78" stroke-width="1.5"/>
<text x="1520" y="938" text-anchor="middle" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="20" font-weight="600" fill="#00BD78">AUTO</text>

<!-- Priority arrow on the left -->
<line x1="180" y1="990" x2="180" y2="90" stroke="#9CA3AF" stroke-width="2"/>
<polygon points="174,95 180,75 186,95" fill="#9CA3AF"/>
<text x="170" y="540" text-anchor="middle" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="20" font-weight="600" fill="#9CA3AF" transform="rotate(-90 170 540)">PRIORITY</text>

</svg>