  <title>ByteByteGo Icon Review</title>
  <style>
    :root {
      color-scheme: light;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #ffffff;
      color: #111111;
    }
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      padding: 32px;
      background: #ffffff;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 28px;
      line-height: 1.1;
    }
    p {
      margin: 0 0 28px;
      color: #555555;
      font-size: 15px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 18px;
    }
    .card {
      border: 1px solid #e8e8e8;
      border-radius: 18px;
      padding: 18px;
      background: #ffffff;
    }
    .frame {
      display: grid;
      place-items: center;
      min-height: 140px;
      border-radius: 14px;
      background:
        linear-gradient(#fafafa, #fafafa),
        linear-gradient(90deg, #f1f1f1 1px, transparent 1px),
        linear-gradient(#f1f1f1 1px, transparent 1px);
      background-size: auto, 20px 20px, 20px 20px;
    }
    .frame svg {
      width: 84px;
      height: 84px;
      display: block;
    }
    .name {
      margin-top: 14px;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.02em;
    }
  </style>
</head>
