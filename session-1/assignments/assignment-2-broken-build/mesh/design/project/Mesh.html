<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Mesh — Second Brain</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root {
    --ink-0: oklch(0.14 0.018 250);
    --ink-1: oklch(0.18 0.018 250);
    --ink-2: oklch(0.22 0.020 250);
    --ink-3: oklch(0.27 0.022 250);
    --line: oklch(0.32 0.022 250);
    --line-soft: oklch(0.28 0.020 250 / 0.6);
    --text: oklch(0.94 0.008 250);
    --text-dim: oklch(0.66 0.014 250);
    --text-faint: oklch(0.48 0.014 250);
    --cyan: oklch(0.84 0.13 200);
    --cyan-dim: oklch(0.72 0.10 200);
    --amber: oklch(0.80 0.13 75);
    --amber-dim: oklch(0.70 0.11 75);
    --font-sans: "Geist", ui-sans-serif, system-ui, sans-serif;
    --font-mono: "Geist Mono", ui-monospace, "SF Mono", monospace;
  }
  * { box-sizing: border-box; }
  html, body, #root { height: 100%; margin: 0; }
  body {
    background: var(--ink-0);
    color: var(--text);
    font-family: var(--font-sans);
    font-size: 14px;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  button { font-family: inherit; color: inherit; background: none; border: none; cursor: pointer; padding: 0; }
  input { font-family: inherit; color: inherit; background: none; border: none; outline: none; }
  kbd {
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--text-faint);
    background: oklch(0.16 0.018 250);
    border: 1px solid var(--line);
    border-radius: 3px;
    padding: 1px 5px;
    line-height: 1;
  }

  .app { position: fixed; inset: 0; }

  .bg-grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(oklch(0.22 0.020 250 / 0.35) 1px, transparent 1px),
      linear-gradient(90deg, oklch(0.22 0.020 250 / 0.35) 1px, transparent 1px);
    background-size: 64px 64px;
    background-position: -1px -1px;
    pointer-events: none;
    mask-image: radial-gradient(ellipse 70% 60% at center, black 30%, transparent 95%);
    -webkit-mask-image: radial-gradient(ellipse 70% 60% at center, black 30%, transparent 95%);
  }
  .bg-vignette {
    position: absolute; inset: 0;
    background:
      radial-gradient(ellipse 80% 60% at 50% 50%, transparent 30%, oklch(0.10 0.018 250 / 0.6) 100%);
    pointer-events: none;
  }
  .graph-wrap { position: absolute; inset: 0; }

  /* TOP BAR */
  .topbar {
    position: absolute; top: 0; left: 0; right: 0;
    display: flex; align-items: center; justify-content: space-between;
    padding: 18px 22px;
    z-index: 5;
    pointer-events: none;
  }
  .topbar > * { pointer-events: auto; }

  .brand { display: flex; align-items: center; gap: 12px; }
  .brand-glyph {
    width: 30px; height: 30px;
    display: grid; place-items: center;
    border: 1px solid var(--line);
    border-radius: 8px;
    color: var(--cyan);
    background: oklch(0.20 0.020 250 / 0.6);
    backdrop-filter: blur(6px);
  }
  .brand-text { line-height: 1.1; }
  .brand-name {
    font-weight: 600;
    letter-spacing: -0.01em;
    font-size: 14px;
  }
  .brand-sub {
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--text-faint);
    margin-top: 2px;
    letter-spacing: 0.02em;
  }

  .topbar-stats {
    display: flex; align-items: center; gap: 16px;
    background: oklch(0.20 0.020 250 / 0.55);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 7px 16px;
    backdrop-filter: blur(8px);
  }
  .stat { display: flex; align-items: baseline; gap: 6px; }
  .stat-num { font-family: var(--font-mono); font-size: 12px; font-weight: 500; color: var(--text); }
  .stat-label { font-size: 11px; color: var(--text-faint); letter-spacing: 0.02em; }
  .stat-sep { width: 1px; height: 14px; background: var(--line); }

  .topbar-actions { display: flex; align-items: center; gap: 8px; }
  .ghost-btn {
    display: flex; align-items: center; gap: 8px;
    padding: 7px 10px 7px 12px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: oklch(0.20 0.020 250 / 0.55);
    backdrop-filter: blur(8px);
    color: var(--text-dim);
    font-size: 12.5px;
    transition: all .15s;
  }
  .ghost-btn:hover { color: var(--text); border-color: oklch(0.40 0.025 250); }
  .ghost-btn svg { color: var(--text-faint); }

  /* HINT */
  .hint {
    position: absolute;
    top: 50%; left: 50%; transform: translate(-50%, -50%);
    display: flex; align-items: center; gap: 8px;
    color: var(--text-faint);
    font-size: 11.5px;
    letter-spacing: 0.02em;
    background: oklch(0.20 0.020 250 / 0.4);
    border: 1px solid var(--line-soft);
    border-radius: 999px;
    padding: 6px 14px;
    backdrop-filter: blur(6px);
    pointer-events: none;
    animation: fadeIn .8s ease 0.4s both;
  }
  .hint-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--cyan); box-shadow: 0 0 8px var(--cyan); animation: pulse 2s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { opacity: 0.6; } 50% { opacity: 1; } }
  @keyframes fadeIn { from { opacity: 0; transform: translate(-50%, calc(-50% + 6px)); } to { opacity: 1; transform: translate(-50%, -50%); } }

  /* CAPTURE BAR */
  .capture {
    position: absolute;
    bottom: 28px; left: 50%; transform: translateX(-50%);
    display: flex; align-items: center; gap: 10px;
    width: min(560px, 80vw);
    padding: 12px 14px 12px 16px;
    background: oklch(0.20 0.020 250 / 0.75);
    border: 1px solid var(--line);
    border-radius: 14px;
    backdrop-filter: blur(14px);
    box-shadow: 0 12px 40px oklch(0.05 0.02 250 / 0.5), 0 0 0 1px oklch(0.10 0.018 250 / 0.5);
    z-index: 5;
    transition: all .2s;
  }
  .capture.focused {
    border-color: oklch(0.50 0.08 200);
    box-shadow: 0 12px 40px oklch(0.05 0.02 250 / 0.6),
                0 0 0 3px oklch(0.50 0.10 200 / 0.18);
  }
  .capture-glyph {
    color: var(--text-faint);
    display: grid; place-items: center;
    width: 22px; height: 22px;
  }
  .capture.focused .capture-glyph { color: var(--cyan); }
  .capture-input {
    flex: 1;
    font-size: 14.5px;
    padding: 2px 0;
  }
  .capture-input::placeholder { color: var(--text-faint); }
  .capture-meta {
    font-family: var(--font-mono);
    font-size: 10.5px;
    color: var(--text-faint);
    padding: 4px 7px;
    border-radius: 5px;
    border: 1px solid var(--line);
  }
  .capture-go {
    color: var(--cyan);
    border-color: oklch(0.50 0.10 200);
  }

  /* NODE CARD */
  .node-card {
    position: absolute;
    bottom: 96px; left: 22px;
    width: 320px;
    background: oklch(0.20 0.020 250 / 0.85);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 14px 14px 10px;
    backdrop-filter: blur(14px);
    box-shadow: 0 12px 40px oklch(0.05 0.02 250 / 0.5);
    z-index: 4;
    animation: slideUp .25s ease;
  }
  @keyframes slideUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  .node-card-head {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 8px;
  }
  .node-card-meta { display: flex; align-items: center; gap: 10px; }
  .node-id {
    font-family: var(--font-mono);
    font-size: 10.5px;
    color: var(--cyan);
    background: oklch(0.30 0.06 200 / 0.18);
    border: 1px solid oklch(0.40 0.08 200 / 0.4);
    padding: 2px 6px;
    border-radius: 4px;
  }
  .node-time {
    font-family: var(--font-mono);
    font-size: 10.5px;
    color: var(--text-faint);
  }
  .x-btn {
    width: 22px; height: 22px;
    display: grid; place-items: center;
    color: var(--text-faint);
    font-size: 18px;
    line-height: 1;
    border-radius: 4px;
    transition: all .12s;
  }
  .x-btn:hover { color: var(--text); background: oklch(0.30 0.020 250 / 0.6); }
  .node-content {
    font-size: 14.5px;
    line-height: 1.45;
    text-wrap: pretty;
    margin-bottom: 14px;
    color: var(--text);
  }
  .node-conns-label {
    display: flex; align-items: center; gap: 10px;
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--text-faint);
    letter-spacing: 0.08em;
    margin-bottom: 8px;
  }
  .rule { flex: 1; height: 1px; background: var(--line); }
  .empty-conns {
    font-size: 12px;
    color: var(--text-faint);
    padding: 6px 0;
    font-style: italic;
  }
  .conn-row {
    position: relative;
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 10px;
    align-items: center;
    width: 100%;
    text-align: left;
    padding: 7px 8px;
    border-radius: 6px;
    transition: background .12s;
    overflow: hidden;
  }
  .conn-row:hover { background: oklch(0.26 0.020 250 / 0.6); }
  .conn-bar {
    position: absolute;
    left: 0; top: 0; bottom: 0;
    background: linear-gradient(90deg, oklch(0.50 0.10 200 / 0.22), transparent 90%);
    pointer-events: none;
  }
  .conn-text {
    position: relative;
    font-size: 13px;
    color: var(--text);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .conn-score {
    position: relative;
    font-family: var(--font-mono);
    font-size: 10.5px;
    color: var(--cyan-dim);
  }

  /* SEARCH PANEL */
  .search-panel {
    position: absolute;
    top: 0; right: 0; bottom: 0;
    width: 380px;
    background: oklch(0.18 0.020 250 / 0.92);
    border-left: 1px solid var(--line);
    backdrop-filter: blur(18px);
    transform: translateX(100%);
    transition: transform .28s cubic-bezier(.2,.9,.2,1);
    display: flex;
    flex-direction: column;
    z-index: 6;
    box-shadow: -20px 0 60px oklch(0.05 0.02 250 / 0.5);
  }
  .search-panel.open { transform: translateX(0); }
  .search-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 18px 20px 12px;
  }
  .search-head-label {
    font-family: var(--font-mono);
    font-size: 10.5px;
    color: var(--text-faint);
    letter-spacing: 0.12em;
  }
  .search-input-wrap {
    display: flex; align-items: center; gap: 10px;
    margin: 0 20px 14px;
    padding: 10px 12px;
    border: 1px solid var(--line);
    border-radius: 9px;
    background: oklch(0.16 0.020 250);
    transition: all .15s;
  }
  .search-input-wrap:focus-within {
    border-color: oklch(0.50 0.08 200);
    box-shadow: 0 0 0 3px oklch(0.50 0.10 200 / 0.15);
  }
  .search-input-wrap svg { color: var(--text-faint); }
  .search-input { flex: 1; font-size: 14px; }
  .search-input::placeholder { color: var(--text-faint); }

  .search-suggest { padding: 4px 20px 8px; }
  .suggest-block { padding-top: 6px; }
  .suggest-label {
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--text-faint);
    letter-spacing: 0.12em;
    margin-bottom: 6px;
  }
  .suggest-row {
    display: flex; align-items: center; gap: 10px;
    width: 100%; text-align: left;
    padding: 8px 6px;
    color: var(--text-dim);
    font-size: 13px;
    border-radius: 6px;
    transition: all .12s;
  }
  .suggest-row:hover { color: var(--text); background: oklch(0.24 0.020 250 / 0.6); }
  .suggest-arrow { color: var(--text-faint); font-family: var(--font-mono); }

  .search-results {
    overflow-y: auto;
    padding: 4px 20px 24px;
    flex: 1;
  }
  .results-label {
    display: flex; align-items: center; gap: 10px;
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--text-faint);
    letter-spacing: 0.10em;
    margin: 6px 0 12px;
  }
  .results-label .dim { color: oklch(0.42 0.014 250); text-transform: none; letter-spacing: 0.02em; }
  .empty-results {
    padding: 18px 4px;
    color: var(--text-dim);
  }
  .empty-results-title { font-size: 13px; margin-bottom: 4px; }
  .empty-results-sub { font-size: 12px; color: var(--text-faint); line-height: 1.5; }

  .result-row {
    display: grid;
    grid-template-columns: auto 1fr;
    gap: 12px;
    width: 100%;
    text-align: left;
    padding: 12px;
    border: 1px solid var(--line-soft);
    border-radius: 9px;
    margin-bottom: 8px;
    background: oklch(0.20 0.020 250 / 0.4);
    transition: all .12s;
  }
  .result-row:hover {
    border-color: oklch(0.40 0.025 250);
    background: oklch(0.22 0.020 250 / 0.7);
  }
  .result-row.active {
    border-color: oklch(0.55 0.10 75);
    background: oklch(0.22 0.025 75 / 0.25);
  }
  .result-rank {
    font-family: var(--font-mono);
    font-size: 10.5px;
    color: var(--text-faint);
    padding-top: 2px;
  }
  .result-text {
    font-size: 13.5px;
    line-height: 1.45;
    color: var(--text);
    text-wrap: pretty;
    margin-bottom: 8px;
  }
  .result-meta {
    display: flex; align-items: center; gap: 10px;
  }
  .result-bar {
    flex: 1;
    height: 3px;
    background: oklch(0.28 0.020 250);
    border-radius: 2px;
    overflow: hidden;
  }
  .result-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--amber-dim), var(--amber));
    box-shadow: 0 0 8px oklch(0.70 0.13 75 / 0.6);
  }
  .result-score {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--amber);
  }
  .result-score .dim { color: var(--text-faint); }

  /* EMPTY */
  .empty {
    position: absolute;
    top: 50%; left: 50%; transform: translate(-50%, -50%);
    text-align: center;
    pointer-events: none;
  }
  .empty-title {
    font-size: 22px;
    font-weight: 500;
    letter-spacing: -0.01em;
    margin-bottom: 6px;
  }
  .empty-sub { color: var(--text-faint); font-size: 13px; }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-thumb { background: oklch(0.30 0.020 250); border-radius: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="embed.jsx"></script>
<script type="text/babel" src="seed.jsx"></script>
<script type="text/babel" src="graph.jsx"></script>
<script type="text/babel" src="app.jsx"></script>
</body>
</html>
